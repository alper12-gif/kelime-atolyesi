<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{const d=JSON.parse(localStorage.getItem('kelime_atolyesi_v1'));document.documentElement.dataset.theme=(d&&d.theme)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<title>Kelime Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f6fc;--grid:#e1e8f6;--sheet:#fff;--ink:#14213d;--mut:#4a5775;--line:#cfd9ee;--blue:#2b50d8;--blue-d:#1f3bb0;--bt:#2b50d8;--tint:#e8eefc;--hl:#ffe066;--red:#d8344a;--redb:#fdecef;--green:#1b8a57;--greenb:#e6f6ee;--rule:var(--rule);--margin:var(--margin);--pen:'Caveat',cursive;color-scheme:light}
[data-theme=dark]{--paper:#0d1424;--grid:#161f36;--sheet:#17213b;--ink:#e9eefb;--mut:#a3b0cf;--line:#2b3a5f;--blue:#4b6df0;--blue-d:#3855d4;--bt:#93a9ff;--tint:#243157;--red:#ff7186;--redb:#3b1c29;--green:#4cd08e;--greenb:#16322a;--rule:#212d4e;--margin:#7d3b4b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--sheet);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:10}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:24px;padding:0 20px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.brand i{display:block;width:26px;height:30px;border:2px solid var(--ink);border-radius:3px 6px 6px 3px;position:relative;background:var(--sheet)}
.brand i::before{content:"";position:absolute;left:-2px;top:-2px;bottom:-2px;width:7px;background:var(--blue);border-radius:3px 0 0 3px}
.brand i::after{content:"";position:absolute;left:11px;right:3px;top:9px;height:7px;background:var(--hl)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;padding:17px 12px 15px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button:hover{color:var(--ink)}nav button.on{color:var(--ink);border-bottom-color:var(--blue)}
main{max-width:1040px;margin:auto;padding:28px 20px 90px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.03em;margin:0 0 6px;font-weight:800}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.mut{color:var(--mut)}.small{font-size:14px}
.section{border-top:3px solid var(--ink);padding-top:14px;margin-top:34px}
.section>h2{margin-bottom:12px}
.btn{background:var(--blue);color:#fff;border:2px solid var(--blue);border-radius:5px;padding:11px 20px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}.btn:active{transform:translateY(1px)}
.btn.line{background:var(--sheet);color:var(--ink);border-color:var(--ink)}.btn.line:hover{background:var(--tint)}
.btn.warn{background:var(--sheet);color:var(--red);border-color:var(--red)}.btn.warn:hover{background:var(--redb)}
.btn.sm{padding:6px 12px;font-size:14px}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:15px 28px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.ico{vertical-align:-3px}
/* sheet = defter sayfası */
.sheet{background-color:var(--sheet);border:2px solid var(--ink);border-radius:4px 10px 10px 4px;padding:26px 28px 26px 84px;position:relative;
 background-image:linear-gradient(90deg,transparent 58px,var(--margin) 58px,var(--margin) 60px,transparent 60px),repeating-linear-gradient(transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);}
.sheet.plain{background-image:linear-gradient(90deg,transparent 58px,var(--margin) 58px,var(--margin) 60px,transparent 60px)}
.hole{position:absolute;left:18px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:34px;align-items:start}
.hero-n{font-size:clamp(54px,9vw,84px);font-weight:800;line-height:1;letter-spacing:-.04em}
.split{display:flex;gap:18px;margin:6px 0 20px;flex-wrap:wrap}.split div b{font-size:24px;display:block;line-height:1.1}
/* grafikler */
.fc{display:flex;align-items:flex-end;gap:8px;height:130px;border-bottom:2px solid var(--ink);padding-top:10px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:13px;font-weight:700}
.fc i{display:block;width:100%;background:var(--blue);border:2px solid var(--ink);border-bottom:0;min-height:3px;border-radius:3px 3px 0 0;margin-top:3px}
.fc div:first-child i{background:var(--hl)}
.fl{display:flex;gap:8px;font-size:12px;color:var(--mut);margin-top:4px}.fl span{flex:1;text-align:center}
.ladder{display:flex;height:22px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;margin:6px 0 8px}
.ladder i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.leg b{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:260px}
.cal i{aspect-ratio:1;border:1.5px solid var(--line);border-radius:3px;background:var(--sheet)}
.cal i.t1{background:#c5d3fa;border-color:#9fb4f2}.cal i.t2{background:#7f9bee;border-color:#5b7be6}.cal i.t3{background:var(--blue);border-color:var(--ink)}.cal i.now{outline:2px solid var(--ink);outline-offset:1px}
/* listeler */
.list>div{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}.list b{display:block}
.chk{width:22px;height:22px;border:2px solid var(--ink);border-radius:4px;background:var(--sheet);flex:none;display:grid;place-items:center;cursor:pointer}
.chk.on{background:var(--hl)}.chk.on::after{content:"";width:11px;height:6px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.setrow{cursor:pointer}.setrow:hover{background:rgba(255,224,102,.25)}
.tag{color:#14213d;display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;background:var(--sheet);white-space:nowrap}
.tag.n{background:var(--sheet);color:var(--ink)}.tag.l{background:#c5d3fa}.tag.m{background:var(--hl)}.tag.k{background:#b9ead1}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:5px;background:var(--sheet);font-size:16px}
textarea{resize:vertical}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--sheet)}th{text-align:left;font-size:13px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--ink)}td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{padding:6px 8px;font-size:14px;border-width:1.5px}tr.empty td input{border-color:var(--red);background:var(--redb)}
.tbl{border:2px solid var(--ink);border-radius:6px;overflow-x:auto;background:var(--sheet)}
.drop{border:3px dashed var(--ink);border-radius:8px;padding:34px 20px;text-align:center;background:var(--sheet)}
.drop.over{background:var(--hl)}
/* çalışma */
.prog{height:8px;border:2px solid var(--ink);border-radius:9px;background:var(--sheet);overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.q{font-size:15px;color:var(--mut);margin-bottom:4px}
.word{font-size:clamp(34px,7vw,58px);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin:6px 0 14px;word-break:break-word}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);background-size:0% 100%;background-repeat:no-repeat;animation:swipe .6s .15s ease-out forwards;padding:0 4px;margin:0 -4px}
@keyframes swipe{to{background-size:100% 100%}}
.tr{font-size:26px;font-weight:600;color:var(--bt);margin-bottom:10px}
.ex{font-size:17px;color:var(--mut);margin:0 0 12px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:2px solid var(--ink);border-radius:5px;padding:12px 14px;font-size:18px;cursor:pointer}
.opt:hover{background:var(--tint)}.opt kbd{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font:700 13px/1 inherit;background:var(--sheet)}
.opt.good{background:var(--hl)}.opt.wrong{background:var(--redb);border-color:var(--red);text-decoration:line-through;text-decoration-color:var(--red)}
.pen{font-family:var(--pen);font-size:30px;line-height:1.1;color:var(--red);transform:rotate(-1.5deg);display:inline-block;margin:4px 0}
.fb{margin-top:18px;padding:14px 16px;border-left:6px solid;background:var(--sheet);border-radius:0 6px 6px 0;border-top:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}.fb.near{border-left-color:#d99200}
.hintline{font-size:24px;letter-spacing:.35em;font-weight:700;min-height:34px;margin:2px 0 8px;font-variant-ligatures:none}
.cloze{font-size:22px;margin:8px 0 14px}.cloze u{text-decoration:none;border-bottom:3px solid var(--ink);padding:0 28px;margin:0 2px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:12px}.pair{background:var(--sheet);border:2px solid var(--ink);border-radius:5px;padding:12px;text-align:left;cursor:pointer;font-size:16px}
.pair.sel{background:var(--hl)}.pair.done{visibility:hidden}.pair.err{background:var(--redb);border-color:var(--red)}
.flip{cursor:pointer;min-height:160px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin:10px 0 18px}.stats b{display:block;font-size:40px;line-height:1;letter-spacing:-.03em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:2px solid var(--ink);background:var(--sheet);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600;cursor:pointer}.chip.on{background:var(--hl)}
.note{font-family:var(--pen);font-size:22px;color:var(--bt)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-weight:600}#toast.show{opacity:1}
.src{font-size:14px;color:var(--mut);margin:0 0 6px}
.method article{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:20px}.method article:last-child{border:0}
details summary{cursor:pointer;font-weight:700}
.tools{display:flex;gap:6px;margin-left:8px}
.tool{width:38px;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .15s}
.tool:hover{background:var(--tint)}.tool:active{transform:scale(.9)}
.chip.on,.opt.good,.pair.sel,.chk.on,.drop.over{color:#14213d}
.opt.good kbd{background:#fff}.chk.on::after{border-color:#14213d}
[data-theme=dark] .hl{background-image:linear-gradient(transparent 52%,rgba(255,224,102,.5) 52%,rgba(255,224,102,.5) 92%,transparent 92%)}
@keyframes pageIn{from{opacity:0;transform:translateX(28px) rotate(.7deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(27,138,87,.6)}100%{box-shadow:0 0 0 18px rgba(27,138,87,0)}}
@keyframes drain{from{width:100%}to{width:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dots{0%,20%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.sheet.enter{animation:pageIn .38s cubic-bezier(.2,.8,.2,1)}
.fb{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
#nextBtn{animation:pop .4s .12s both}
.opt.good{animation:ring .7s}.opt.wrong,.sheet.shake{animation:shake .42s}
.opt{transition:transform .12s,background .15s}.opt:active{transform:scale(.98)}
.auto{height:5px;background:var(--green);border-radius:3px;margin-top:12px;animation:drain 1.15s linear forwards}
.fc i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.pt{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60}
.think span{animation:dots 1s infinite}.think span:nth-child(2){animation-delay:.2s}.think span:nth-child(3){animation-delay:.4s}
.ai{font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
@media(max-width:760px){
 .cols{grid-template-columns:1fr;gap:10px}
 .sheet{padding:20px 16px 20px 52px;background-image:linear-gradient(90deg,transparent 36px,var(--margin) 36px,var(--margin) 38px,transparent 38px),repeating-linear-gradient(transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
 .sheet.plain{background-image:linear-gradient(90deg,transparent 36px,var(--margin) 36px,var(--margin) 38px,transparent 38px)}.hole{left:8px;width:14px;height:14px}
 header{position:static}.bar{height:52px}.tools{margin-left:auto}
 nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--sheet);border-top:2px solid var(--ink);justify-content:space-around;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
 nav button{flex:1;padding:14px 4px;border-bottom:0;margin:0;font-size:14px}nav button.on{background:var(--hl);color:var(--ink)}
 .method article{grid-template-columns:1fr;gap:4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hl{background-size:100% 100%}}
</style>
</head>
<body>
<header><div class="bar"><button class="brand" onclick="go('home')" aria-label="Ana sayfa"><i></i>Kelime Defteri</button><nav id="nav"></nav><div class="tools"><button class="tool" id="bSnd" onclick="toggleSound()"></button><button class="tool" id="bThm" onclick="toggleTheme()"></button></div></div></header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
/* ===== yardımcılar ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const INT=[0,1,2,4,8,16,32];
const KEY='kelime_atolyesi_v1';
let DB,VIEW='home',PREV=[],S=null,EDIT=null,LQ='',LSET='';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const speaker='<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function load(){
  try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  DB=DB||{};DB.words=DB.words||[];DB.sets=DB.sets||[];DB.sel=DB.sel||[];DB.newPerDay=DB.newPerDay||10;DB.log=DB.log||{};
  DB.sel=DB.sel.filter(id=>DB.sets.some(s=>s.id===id));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Kaydedilemedi: tarayıcı depolaması dolu.')}}
const byId=id=>DB.words.find(w=>w.id===id);
const scope=()=>DB.words.filter(w=>!DB.sel.length||DB.sel.includes(w.set));
function logDay(ok){const d=today();const l=DB.log[d]=DB.log[d]||{n:0,ok:0};l.n++;if(ok)l.ok++}
function streak(){let d=today(),n=0;if(!(DB.log[d]&&DB.log[d].n))d--;while(DB.log[d]&&DB.log[d].n){n++;d--}return n}
function say(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\(.*?\)/g,'').replace(/\//g,', ').replace(/\bsth\b/g,'something').replace(/\bsb\b/g,'somebody'));u.lang='en-US';u.rate=rate||.9;speechSynthesis.speak(u)}catch(e){}}
window.say=say;

/* ===== ses, tema, efekt, yapay zeka ===== */
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,v,f2){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),T=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v||.15,T+.015);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(c.destination);o.start(T);o.stop(T+d+.05)}
function sfx(n,combo){if(DB.mute)return;const k=Math.pow(1.0595,Math.min(combo||0,9));
  const m={ok:()=>{tone(659*k,0,.13,'triangle',.17);tone(988*k,.09,.24,'triangle',.17)},
   bad:()=>{tone(250,0,.28,'sawtooth',.08,140)},near:()=>{tone(440,0,.12,'triangle',.14);tone(392,.1,.2,'triangle',.14)},
   tap:()=>tone(560,0,.04,'square',.035),done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.15)),
   master:()=>[784,988,1319,1568].forEach((f,i)=>tone(f,i*.07,.38,'sine',.15))};
  if(m[n])m[n]()}
document.addEventListener('click',e=>{if(e.target.closest('.btn,.chip,.setrow,nav button,.tool,.brand'))sfx('tap')});
function burst(el,n){if(RM()||!el||!el.animate)return;const r=el.getBoundingClientRect(),cx=r.left+Math.min(r.width/2,160),cy=r.top+Math.min(r.height/2,40),cols=['#ffe066','#2b50d8','#1b8a57','#d8344a','#ffffff'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%5]};border:1.5px solid #14213d`;document.body.appendChild(p);
   const a=Math.random()*Math.PI*2,d=70+Math.random()*120;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) rotate(${Math.random()*600}deg)`,opacity:0}],{duration:750+Math.random()*450,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}}
function countUp(){const e=$('#hn');if(!e||RM())return;const n=+e.textContent,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
const iSun='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const iMoon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';

/* ===== cevap kontrolü ===== */
const norm=s=>String(s).toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function variants(en){const o=new Set();const add=x=>{x=norm(x);if(x)o.add(x)};add(en);const n=en.replace(/\(.*?\)/g,'');add(n);n.split('/').forEach(add);return[...o]}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function checkTyped(inp,w){SYN=null;const n=norm(inp);if(!n)return'bad';const v=variants(w.en);if(v.includes(n))return'ok';const sy=synsOf(w).find(x=>variants(x.en).includes(n));if(sy){SYN=sy;return'ok'}const d=Math.min(...v.map(x=>lev(n,x)));return(n.length>=4&&(d<=1||(n.length>=10&&d<=2)))?'near':'bad'}
function hintStr(w,k){const b=w.en.replace(/\(.*?\)/g,'').split('/')[0].trim();let s=0;return b.split('').map(c=>{if(c===' ')return'  ';if(s<k){s++;return c}return'_'}).join(' ')}
const baseWord=w=>w.en.replace(/\(.*?\)/g,'').split('/')[0].trim();
const reOf=w=>new RegExp('(^|[^A-Za-z])('+baseWord(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i');
const hasCloze=w=>!!w.ex&&baseWord(w).split(' ').length<=3&&baseWord(w).length>=3&&reOf(w).test(w.ex);

  return{t,pool,due,fresh,newToday:Math.min(fresh,newLeft),
   lad:[pool.filter(w=>!w.intro).length,it.filter(w=>w.box<=1).length,it.filter(w=>w.box>=2&&w.box<4).length,it.filter(w=>w.box>=4).length],

function savePrev(){
  let added=0,skipped=0;
  PREV.filter(f=>!f.error).forEach(f=>{
    const name=(f.name||'Defter').trim();let set=DB.sets.find(s=>s.name===name);
    if(!set){set={id:uid(),name};DB.sets.push(set)}
    f.words.forEach(w=>{const en=(w.en||'').trim(),tr=(w.tr||'').trim();
      if(!en||!tr){skipped++;return}
      if(DB.words.some(x=>x.set===set.id&&x.en.toLowerCase()===en.toLowerCase()&&x.tr.toLowerCase()===tr.toLowerCase()))return;
      DB.words.push({id:uid(),en,tr,ex:(w.ex||'').trim(),sec:w.sec||'',set:set.id,note:'',box:0,due:0,intro:0,ok:0,bad:0,seen:0});added++});
  });
  save();PREV=[];toast(added+' kelime eklendi'+(skipped?', '+skipped+' boş satır atlandı':''));go('home');
}

function stage(html){
  VIEW='study';
  const left=S.q.length+S.intros.length+S.batches.reduce((a,b)=>a+b.length,0);
  const pct=S.total?Math.round((1-left/S.total)*100):0;
  $('#nav').innerHTML=`<button onclick="if(confirm('Turdan çıkılsın mı? Şu ana kadarki ilerlemen kayıtlı.'))go('home')">Turdan çık</button>`;
  $('#app').innerHTML=`<div class="prog" role="progressbar" aria-valuenow="${Math.max(0,pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(3,Math.min(100,pct))}%"></i></div><div class="sheet enter" id="stage"><span class="hole" style="top:22px"></span><span class="hole" style="bottom:22px"></span>${html}</div>`;
  const i=$('#stage input[type=text]');if(i)i.focus();
}
function startSmart(){
  const pool=scope(),t=today();
  const due=pool.filter(w=>w.intro&&w.due<=t).sort((a,b)=>a.due-b.due||a.box-b.box).slice(0,40);
  const left=Math.max(0,DB.newPerDay-DB.words.filter(w=>w.intro===t).length);
  const fresh=pool.filter(w=>!w.intro).slice(0,left);
  if(!due.length&&!fresh.length){toast('Bugünlük hepsi tamam. Serbest pratik yapabilirsin.');return}
  const batches=[];for(let i=0;i<fresh.length;i+=5)batches.push(fresh.slice(i,i+5).map(w=>w.id));
  if(AI.on)prefetchEx(due.filter(w=>w.box>=2&&!w.ex).map(w=>w.id));
  S={mode:'smart',q:shuffle(due).map(w=>({id:w.id,fails:0,need:1})),intros:[],batches,total:due.length+fresh.length*2,okN:0,badN:0,missed:new Set()};
  next();
}
function startPractice(mode,hard){
  if(mode==='sentence'&&!AI.on){toast('Yapay zekâ kapalı');return}
  const t=today();let pool=scope();
  if(mode==='cloze')pool=pool.filter(hasCloze);
  if(hard)pool=pool.filter(w=>w.bad>0).sort((a,b)=>(b.bad-b.ok)-(a.bad-a.ok));
  else{const learnt=pool.filter(w=>w.intro);pool=shuffle(learnt.length>=5?learnt:pool).sort((a,b)=>(a.due<=t?0:1)-(b.due<=t?0:1)||a.box-b.box)}
  pool=pool.slice(0,mode==='mix'?20:mode==='sentence'?6:15);
  if(!pool.length){toast(hard?'Henüz yanlış yaptığın kelime yok.':mode==='cloze'?'Örnek cümlesi olan kelime yok.'+(AI.on?' Defter sekmesinden yapay zekâyla üretebilirsin.':''):'Önce kelime ekle.');return}
  pool.forEach(w=>{if(!w.intro){w.intro=t;w.due=t}});save();
  S={mode,q:shuffle(pool).map(w=>({id:w.id,fails:0,need:1})),intros:[],batches:[],total:pool.length,okN:0,badN:0,missed:new Set()};
  next();
}
function next(){
  if(S.timer)clearTimeout(S.timer);
  if(S.intros.length)return renderIntro(byId(S.intros[0]));
  if(!S.q.length){
    const ai=aiCandidate();if(ai)return renderSentence(ai);
    if(S.batches.length){S.intros=S.batches.shift();prefetchEx(S.intros);return next()}
    return finish()}
  S.cur=S.q.shift();renderEx(S.cur);
}
const PROMPTS={g:'Kelimeyi gözünde canlandır. Anlamıyla ilgili somut bir sahne kur.',s:'Türkçede kulağa benzeyen bir kelime bul ve onu anlamla bir sahnede birleştir.',c:'Kelimeyi kendi hayatından kısa bir cümlede kullan.'};
function noteBox(w,open){return`<div style="margin-top:14px"><div class="chips" role="group" aria-label="Hafıza bağı türü">${[['g','Görüntü'],['s','Ses benzerliği'],['c','Kendi cümlem']].map(p=>`<button class="chip" onclick="document.getElementById('np').textContent=PROMPTS['${p[0]}'];document.getElementById('nt').focus()">${p[1]}</button>`).join('')}</div>

 <textarea id="nt" rows="2" aria-label="Hafıza ipucu" oninput="byId('${w.id}').note=this.value;save()" style="margin-top:6px">${esc(w.note||'')}</textarea></div>`}
function renderIntro(w){
  say(w.en);
  stage(`<div class="q">Yeni kelime, ${S.intros.length} kaldı</div><div class="word"><span class="hl">${esc(w.en)}</span></div>

function introDone(){const id=S.intros.shift(),w=byId(id);w.intro=today();w.due=today();save();S.q.push({id,fails:0,isNew:true,need:2,stage:0});next()}
function exType(w,it){
  const m=S.mode,cz=hasCloze(w);
  if(m==='smart'){
    if(it.isNew)return it.failed?'mc_tr':(it.stage?'type':'mc_en');
    if(w.box<=1||(it.failed&&w.box<2))return'mc_tr';
    if(w.box<4)return cz&&Math.random()<.5?'cloze':'type';
    return pick(cz?['listen','type','cloze']:['listen','type']);
  }
  if(m==='mc')return pick(['mc_en','mc_tr']);
  if(m==='mix')return pick(cz?['mc_en','mc_tr','type','listen','cloze']:['mc_en','mc_tr','type','listen']);
  return m;
}
const norm2=s=>String(s).toLowerCase().trim();
function distractors(w,field){const seen=new Set([norm2(w[field])]),out=[];
  const pool=shuffle(DB.words.filter(x=>x.id!==w.id&&!shareMeaning(x,w))).sort((a,b)=>((b.set===w.set)-(a.set===w.set))*Math.random());
  for(const x of pool){const k=norm2(x[field]);if(!seen.has(k)){seen.add(k);out.push(x[field]);if(out.length===3)break}}return out}
function renderEx(it){
  const w=byId(it.id);if(!w){next();return}
  const t=exType(w,it);it.t=t;it.hints=0;it.hinted=false;
  if(t==='sentence')return renderSentence(w,it);
  const left=S.q.length+1,tag=it.failed?'Tekrar':it.isNew?'Yeni kelime':'';
  const head=`<div class="q">${tag?tag+', ':''}${left} kaldı</div>`;
  if(t==='mc_en'||t==='mc_tr'){
    const q=t==='mc_en'?w.en:w.tr,field=t==='mc_en'?'tr':'en';
    it.opts=shuffle([w[field],...distractors(w,field)]);if(t==='mc_en')say(w.en);
    stage(head+`<div class="q">${t==='mc_en'?'Türkçesi nedir?':'İngilizcesi nedir?'}</div><div class="word">${esc(q)}</div>
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" onclick="pickMC(${i})"><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div><div id="fb"></div>`);
  }else if(t==='type'||t==='listen'||t==='cloze'){
    let body='';
    if(t==='type')body=`<div class="q">İngilizcesini yaz</div><div class="word">${esc(w.tr)}</div>${synNote(w)}`;
    else if(t==='listen'){body=`<div class="q">Duyduğunu yaz</div><div class="row" style="margin:10px 0"><button class="btn sm" onclick="say(byId('${w.id}').en)">${speaker} Dinle</button><button class="btn line sm" onclick="say(byId('${w.id}').en,.5)">Yavaş</button></div>`;say(w.en)}
    else body=`<div class="q">Boşluğa uyan kelimeyi yaz</div><p class="cloze">${esc(w.ex).replace(reOf(w),(m,a)=>a+'<u></u>')}</p><div class="small mut" style="margin-bottom:6px">Türkçesi: ${esc(w.tr)}</div>`;
    stage(head+body+`<div id="hint" class="hintline" aria-live="polite"></div><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Cevabın" placeholder="Yaz ve Enter'a bas">
    <div class="row" style="margin-top:12px"><button class="btn" onclick="submitTyped()">Kontrol et</button><button class="btn line" onclick="hint()">${t==='listen'?'Anlamı göster':'İpucu'}</button><button class="btn line" onclick="giveUp()">Bilmiyorum</button></div><div id="fb"></div>`);
    $('#ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submitTyped()}});
  }else if(t==='flash'){
    stage(head+`<div class="flip" id="flip" onclick="flipCard()" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}"><div class="q">Önce hatırlamaya çalış, sonra karta dokun</div><div class="word">${esc(w.tr)}</div></div><div id="fb"></div>`);
  }
}
document.addEventListener('keydown',e=>{
  if(VIEW!=='study'||!S)return;const tag=document.activeElement.tagName;
  if(e.key==='Enter'){const b=$('#nextBtn');if(b&&tag!=='TEXTAREA'&&tag!=='INPUT'){e.preventDefault();b.click()}}

});
function hint(){const w=byId(S.cur.id);S.cur.hints++;S.cur.hinted=true;

  $('#ans').focus()}
function pickMC(i){

function submitTyped(){const it=S.cur,w=byId(it.id),v=$('#ans').value;if(!v.trim())return;const r=checkTyped(v,w);$('#ans').disabled=true;say(w.en);feedback(r,w)}

function gradeNow(ok){sfx(ok?'ok':'bad',S.combo);applyGrade(ok,false);next()}
function feedback(kind,w,gaveUp){
  const ok=kind==='ok',it=S.cur;applyGrade(ok,it.hinted&&ok);

     +(syn?`<div class="small mut">Yazdığın “${esc(syn.en)}” de aynı anlama geliyor, o da doğru. Sorulan kelime “${esc(w.en)}” idi.</div>`:'')
     +(it.hinted?'<div class="small mut">İpucu kullandığın için yarın tekrar gelecek.</div>':'')

  }else if(kind==='near'){msg=`<b style="color:#a86a00">Çok yakın, yazımda küçük bir hata var.</b><div class="pen">doğrusu: ${esc(w.en)}</div>`;sfx('near')}

    burst($('#fb'),up?38:cb?20:12);

function applyGrade(ok,hinted){
  const it=S.cur,w=byId(it.id),t=today();w.seen=(w.seen||0)+1;logDay(ok);S.good=S.good||new Set();
  if(ok){w.ok++;S.okN++;S.combo=(S.combo||0)+1;
    if(it.need>1){S.q.splice(Math.min(S.q.length,4+Math.floor(Math.random()*3)),0,{id:it.id,fails:it.fails,failed:it.failed,isNew:it.isNew,need:it.need-1,stage:(it.stage||0)+1})}
    else{if(!it.failed)S.good.add(w.id);
      if(!it.failed&&(S.mode==='smart'||w.due<=t||w.box===0)){const b0=w.box;if(hinted)w.due=t+1;else{w.box=Math.min(6,w.box+1);w.due=t+INT[w.box]}if(b0<4&&w.box>=4)S.lvl=true}}
  }else{
    w.bad++;S.badN++;S.missed.add(w.id);S.combo=0;
    if(!it.failed){w.box=Math.max(0,w.box-2);w.due=t}
    S.q.splice(Math.min(S.q.length,3),0,{id:it.id,fails:(it.fails||0)+1,failed:true,isNew:it.isNew,need:Math.min(it.need||1,2),stage:it.stage||0});
  }
  save();
}
function finish(){
  const tot=S.okN+S.badN,pct=tot?Math.round(S.okN/tot*100):0,t=today();
  const miss=[...S.missed].map(byId).filter(Boolean),tom=DB.words.filter(w=>w.intro&&w.due===t+1).length;
  stage(`<h1 style="margin-bottom:12px">Tur bitti</h1><div class="stats"><div><b>%${pct}</b><span class="mut">doğruluk</span></div><div><b>${S.okN}</b><span class="mut">doğru</span></div><div><b>${S.badN}</b><span class="mut">yanlış</span></div></div>
  ${tom?`<p class="mut">Yarın ${tom} kelime tekrar için sırada.</p>`:''}
  ${miss.length?`<h3 style="margin-top:16px">Takıldığın kelimeler</h3><div class="tbl"><table>${miss.map(w=>`<tr><td><b>${esc(w.en)}</b> <a href="#" onclick="say(byId('${w.id}').en);return false" aria-label="Dinle">${speaker}</a></td><td>${esc(w.tr)}</td></tr>`).join('')}</table></div>`:'<p style="font-weight:600">Hiç yanlışın yok.</p>'}
  <div class="row" style="margin-top:18px"><button class="btn" onclick="go('home')">Ana sayfa</button>${S.mode==='match'?'<button class="btn line" onclick="startMatch()">Tekrar oyna</button>':S.mode!=='smart'?`<button class="btn line" onclick="startPractice('${S.mode}')">Bir tur daha</button>`:''}</div>`);
  $('#nav').innerHTML='';sfx('done');if(pct>=70)setTimeout(()=>burst($('#stage'),44),250);
}

/* ===== EŞLEŞTİRME ===== */
function startMatch(){
  const t=today(),pool=shuffle(scope()).slice(0,18);if(pool.length<4){toast('Eşleştirme için en az 4 kelime gerekli');return}
  pool.forEach(w=>{if(!w.intro){w.intro=t;w.due=t}});
  S={mode:'match',rounds:[],q:[],intros:[],batches:[],total:pool.length,okN:0,badN:0,missed:new Set(),t0:Date.now(),done:0};
  for(let i=0;i<pool.length;i+=6)S.rounds.push(pool.slice(i,i+6).map(w=>w.id));
  matchRound();
}
function matchRound(){
  if(!S.rounds.length){toast('Süre: '+Math.round((Date.now()-S.t0)/1000)+' sn');return finish()}
  const ids=S.rounds.shift();S.m={left:ids.length,sel:null,wrong:new Set()};S.q=Array(Math.max(0,S.total-S.done-ids.length)).fill(0);
  stage(`<div class="q">Her İngilizce kelimeyi Türkçesiyle eşleştir</div><div class="pairs"><div>${shuffle(ids).map(id=>`<button class="pair" style="width:100%;margin-bottom:10px" data-s="en" data-id="${id}" onclick="mPick(this)">${esc(byId(id).en)}</button>`).join('')}</div>
  <div>${shuffle(ids).map(id=>`<button class="pair" style="width:100%;margin-bottom:10px" data-s="tr" data-id="${id}" onclick="mPick(this)">${esc(byId(id).tr)}</button>`).join('')}</div></div>`);
}
function mPick(b){
  const m=S.m;if(b.classList.contains('done'))return;
  if(b.dataset.s==='en')say(byId(b.dataset.id).en);
  if(!m.sel||m.sel.dataset.s===b.dataset.s){if(m.sel)m.sel.classList.remove('sel');m.sel=b;b.classList.add('sel');return}
  const a=m.sel;m.sel=null;a.classList.remove('sel');const w=byId(a.dataset.id);
  if(a.dataset.id===b.dataset.id){
    a.classList.add('done');b.classList.add('done');m.left--;S.done++;sfx('ok');
    if(!m.wrong.has(w.id)){w.ok++;S.okN++;logDay(true);if(w.due<=today()||w.box===0){w.box=Math.min(6,w.box+1);w.due=today()+INT[w.box]}}
    save();if(!m.left)setTimeout(matchRound,350);
  }else{
    a.classList.add('err');b.classList.add('err');sfx('bad');setTimeout(()=>{a.classList.remove('err');b.classList.remove('err')},450);
    [a,b].forEach(x=>{const ww=byId(x.dataset.id);if(!m.wrong.has(ww.id)){m.wrong.add(ww.id);ww.bad++;S.badN++;S.missed.add(ww.id);logDay(false);ww.box=Math.max(0,ww.box-1);ww.due=today()}});save();
  }
}
load();render();aiInit();
</script>
